x-podman:
  docker_compose_compat: true

services:
  db:
    image: postgres:15-alpine
    container_name: demo-db
    hostname: db
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: demo-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://demo:demo@db:5432/demo
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: demo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:

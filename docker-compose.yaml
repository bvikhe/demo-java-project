services:
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: demo-db
    network_mode: host
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: demo-backend
    network_mode: host
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://demo:demo@localhost:5432/demo
      - PORT=3000
    depends_on:
      - db
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    container_name: demo-frontend
    network_mode: host
    depends_on:
      - backend

volumes:
  pgdata:
